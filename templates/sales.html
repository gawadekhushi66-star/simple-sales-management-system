{% extends "base.html" %}{% block title %}New Sale{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body p-4">
<h1>Record a Sale</h1><p class="text-muted">The system calculates the total and reduces product stock automatically.</p>
{% if not products %}<div class="alert alert-warning">There are no products with available stock. Add a product first.</div>{% endif %}
<form method="post">
<label class="form-label">Customer (optional)</label><select class="form-select mb-3" name="customer_id"><option value="">Walk-in Customer</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
<label class="form-label">Product *</label><select class="form-select mb-3" name="product_id" required>{% for p in products %}<option value="{{ p.id }}">{{ p.name }} — ₹{{ '%.2f'|format(p.price) }} (Stock: {{ p.stock }})</option>{% endfor %}</select>
<label class="form-label">Quantity *</label><input class="form-control mb-3" type="number" name="quantity" min="1" value="1" required>
<button class="btn btn-primary" {% if not products %}disabled{% endif %}>Save Sale & Calculate Bill</button>
</form></div></div></div></div>{% endblock %}
